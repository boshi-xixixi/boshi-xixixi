# 用法：放在 boshi-xixixi/boshi-xixixi 仓库 .github/workflows/ 下。
# 作用：每天自动生成 GitHub 统计卡片 SVG 到 output 分支，
#       README 通过 jsDelivr 读取，国内直连可访问（不依赖 vercel.app）。

name: Profile Summary Cards

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 UTC 1 点更新
  workflow_dispatch:       # 支持手动触发
  push:
    branches: [main]
    paths: ['.github/workflows/profile-summary-cards.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: boshi-xixixi
          BRANCH_NAME: main
          THEME: radical
          UTC_OFFSET: 8
